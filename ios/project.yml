name: Godwit
options:
  bundleIdPrefix: com.jordanlyall
  deploymentTarget:
    iOS: "17.0"
targets:
  Godwit:
    type: application
    platform: iOS
    sources:
      - path: Godwit
    dependencies:
      - framework: Godwit.xcframework
        embed: false
      - framework: MygoSQLite.xcframework
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanlyall.godwit
        # The core framework's module is Godwit; the app's own module must differ.
        PRODUCT_MODULE_NAME: GodwitShell
        DEVELOPMENT_TEAM: 9Z844G4BAH
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Godwit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Godwit connects to mail servers on your local network when you add one."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "5.0"
        OTHER_LDFLAGS: ["-lresolv"]
