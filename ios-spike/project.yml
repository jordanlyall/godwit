name: GodwitSpike
options:
  bundleIdPrefix: com.jordanlyall
  deploymentTarget:
    iOS: "17.0"
targets:
  GodwitSpike:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: GodwitSpikeApp.swift
    dependencies:
      - framework: Godwit.xcframework
        embed: false
      - framework: MygoSQLite.xcframework
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanlyall.godwitspike
        DEVELOPMENT_TEAM: 9Z844G4BAH
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Syncs mail from the spike test server on this network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: GodwitSpike
        SWIFT_VERSION: "5.0"
        OTHER_LDFLAGS: ["-lresolv"]
